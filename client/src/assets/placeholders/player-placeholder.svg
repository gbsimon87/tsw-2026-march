<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Player image placeholder">
  <!-- Was sky #0ea5e9, which put player avatars in a hue the app uses nowhere
       else and made the same person read as two different colours depending on
       the surface. Ink ground with the amber figure keeps it in the brand and
       still reads as "a player", not "a team". -->
  <rect width="512" height="512" rx="96" fill="#141414" />
  <circle cx="256" cy="186" r="94" fill="#F4A300" />
  <path d="M128 392c28-78 86-132 128-132s100 54 128 132" fill="#F4A300" />
  <path d="M198 176c10 18 30 30 58 30s48-12 58-30" fill="none" stroke="#141414" stroke-width="18" stroke-linecap="round" />
</svg>
