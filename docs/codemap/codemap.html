<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSW Code Map</title>
<style>
:root{
  --bg:#f7f6f3; --panel:#fffefb; --ink:#1c1a17; --muted:#6b655c; --line:#ddd8cf;
  --server:#1f6f6b; --client:#8a5a1f; --infra:#4a4f7a; --ext:#7a3b5c; --db:#2f5d3a;
  --accent:#b3421f; --shadow:0 1px 2px rgba(30,26,20,.06),0 8px 24px rgba(30,26,20,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#14140f; --panel:#1c1c17; --ink:#ecebe4; --muted:#9a948a; --line:#33322b;
  --server:#57bdb4; --client:#d69a4e; --infra:#96a0d8; --ext:#d68fb0; --db:#7cc08d;
  --accent:#f0855c; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.wrap{max-width:1600px;margin:0 auto;padding:22px clamp(14px,3vw,32px) 64px}
header.top{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
h1{margin:0;font-size:clamp(20px,3vw,27px);letter-spacing:-.02em;font-weight:650}
.sub{color:var(--muted);font-size:13.5px;margin-top:5px}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:3px 10px;font-size:11.5px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media (max-width:1080px){.layout{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:650}

.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button.t{font:inherit;font-size:12px;padding:4px 10px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted)}
button.t:hover{color:var(--ink);border-color:var(--muted)}
button.t[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input.search{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:7px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);width:150px}

/* ── graph ── */
.graphbox{padding:6px 8px 12px;overflow-x:auto}
svg#graph{display:block;width:100%;height:auto;min-width:820px}
.nd{cursor:pointer}
.nd rect{transition:fill .12s,stroke-width .12s}
.nd text{pointer-events:none;font-size:12.5px;font-weight:600;fill:var(--ink)}
.nd .cnt{font-size:10px;font-weight:500;fill:var(--muted)}
.nd:hover rect{stroke-width:2.4}
.nd.sel rect{stroke-width:3}
.nd.dim{opacity:.2}
.ed{fill:none;stroke:var(--muted);stroke-opacity:.17}
.ed.hi{stroke:var(--accent);stroke-opacity:1;stroke-width:2.1}
.ed.dim{stroke-opacity:.07}
.lane{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  fill:var(--muted);font-weight:650}
.lanebg{fill:currentColor;opacity:.028}

/* ── detail ── */
.detail{position:sticky;top:16px;max-height:calc(100vh - 34px);overflow-y:auto}
.dbody{padding:15px}
.kindtag{display:inline-block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:650;padding:2px 8px;border-radius:5px;margin-bottom:9px}
.dbody h3{margin:0 0 3px;font-size:19px;letter-spacing:-.01em}
.ppath{font-size:11.5px;color:var(--muted);word-break:break-all;margin-bottom:11px}
.role{font-size:13.5px;line-height:1.6;margin:0 0 15px}
.sec{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:0}
.sec h4{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);font-weight:650;display:flex;justify-content:space-between}
.rel{display:flex;flex-direction:column;gap:5px}
.rel a{display:flex;gap:7px;align-items:baseline;text-decoration:none;color:var(--ink);
  font-size:12.5px;padding:4px 7px;border-radius:6px;border:1px solid transparent}
.rel a:hover{background:var(--bg);border-color:var(--line)}
.rel .vb{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace;flex-shrink:0}
.rel .lbl{color:var(--muted);font-size:10.5px}
ul.files{list-style:none;margin:0;padding:0;font-size:11.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  max-height:190px;overflow-y:auto;color:var(--muted)}
ul.files li{padding:1.5px 0;word-break:break-all}
ul.files li b{color:var(--ink);font-weight:600}
.empty{color:var(--muted);font-size:12.5px;font-style:italic}
.mods{display:flex;flex-wrap:wrap;gap:4px}
.mods span{font-size:10.5px;font-family:ui-monospace,monospace;border:1px solid var(--line);
  border-radius:5px;padding:1.5px 6px;color:var(--muted)}

/* ── flows ── */
.flowwrap{margin-top:20px}
.ftabs{display:flex;gap:5px;flex-wrap:wrap;padding:11px 15px 0}
button.ft{font:inherit;font-size:12px;padding:5px 11px;border-radius:7px 7px 0 0;cursor:pointer;
  border:1px solid transparent;border-bottom:none;background:transparent;color:var(--muted)}
button.ft:hover{color:var(--ink)}
button.ft[aria-selected=true]{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:600}
.fpane{padding:15px;border-top:1px solid var(--line)}
.fwhy{font-size:13px;color:var(--muted);margin:0 0 15px;max-width:75ch;line-height:1.6}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 38px;border-left:2px solid var(--line);margin-left:11px}
ol.steps li:last-child{border-left-color:transparent;padding-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:-12px;top:-2px;width:22px;height:22px;
  border-radius:50%;background:var(--panel);border:1.5px solid var(--line);color:var(--muted);
  font-size:10.5px;font-weight:700;display:grid;place-items:center}
.stitle{font-size:13px;font-weight:600;margin-bottom:2px}
.snode{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:650;
  cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.sfile{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;word-break:break-all;margin-top:2px}
.sfile b{color:var(--ink);font-weight:600}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  color:var(--muted);font-size:11.5px;line-height:1.7}
</style>
</head>

      </div>
      <div class="graphbox"><svg id="graph" role="img" aria-label="Architecture map of the TSW monorepo: client features call server domain modules over HTTP; server modules persist to MongoDB and call external services."></svg></div>

    <section class="card flowwrap">

      <div class="fpane" id="fpane"></div>
    </section>
  </div>

  <aside class="card detail"><div class="dbody" id="detail"></div></aside>
</div>

<footer id="foot"></footer>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const N = Object.fromEntries(D.nodes.map(n => [n.id, n]));
const KIND = {
  'server-module': {c:'var(--server)', t:'Server module'},
  'client-feature':{c:'var(--client)', t:'Client feature'},
  'infra':        {c:'var(--infra)',  t:'Platform'},
  'datastore':    {c:'var(--db)',     t:'Data store'},
  'external':     {c:'var(--ext)',    t:'External service'},
};
// The first screen is capped at 20 primary nodes. Two lanes ship collapsed into
// a single aggregate node; minor server modules are folded in too. Each is
// expandable, and the aggregates synthesise their children's edges so the
// collapsed view still tells the truth about what talks to what.
const MINOR = new Set(['health','contact','analytics','follows','export']);
const GROUPS = {
  'g-client': {
    label:'Client (React SPA)', kind:'client-feature', group:'Client features',
    members: D.nodes.filter(n => n.kind==='client-feature').map(n => n.id),
    path:'client/src',
    role:'The React 18 + Vite SPA, as one node. 9 feature areas under '
      +'<code>client/src/features/</code> plus the composition root in <code>client/src/app/</code>. '
      +'All traffic leaves through <code>lib/apiClient.js</code>, which handles the CSRF header and '
      +'replays a request once through <code>/auth/refresh</code> on a 401. Expand the lane to see '
      +'each feature and the exact endpoints it calls.',
  },
  'g-external': {
    label:'External services', kind:'external', group:'External services',
    members: D.nodes.filter(n => n.kind==='external').map(n => n.id),
    path:null,
    role:'The six third-party dependencies, as one node: Stripe (hosted Checkout + webhooks), '
      +'Cloudinary (media), OpenAI (game recaps), PostHog (analytics), Google OAuth (sign-in) '
      +'and Resend (transactional email). Expand to see which modules reach each one.',
  },
};
let expanded = new Set();   // group ids that are expanded
let showMinor = false, sel = null, query = '';

// Map a real node id to whatever currently represents it on screen.
function repr(id){
  for (const [gid,g] of Object.entries(GROUPS))
    if (!expanded.has(gid) && g.members.includes(id)) return gid;
  return id;
}
function visible(){
  const out = [];
  for (const [gid,g] of Object.entries(GROUPS)) if (!expanded.has(gid)) out.push(synth(gid));
  for (const n of D.nodes){
    if (repr(n.id) !== n.id) continue;                 // folded into an aggregate
    if (!showMinor && MINOR.has(n.id)) continue;       // minor module, hidden
    out.push(n);
  }
  return out;
}
// Build the aggregate node: union of members' files, tests, models and edges.
function synth(gid){
  const g = GROUPS[gid], mem = g.members.map(id => N[id]);
  return {
    id: gid, label: g.label, kind: g.kind, group: g.group, path: g.path, role: g.role,
    isGroup: true, memberIds: g.members,
    models: [...new Set(mem.flatMap(m => m.models))],
    mount: null,
    loc: mem.reduce((s,m) => s+m.loc, 0),
    files: mem.flatMap(m => m.files), tests: mem.flatMap(m => m.tests),
    flows: [...new Set(mem.flatMap(m => m.flows))],
  };
}

/* ── layout: four vertical lanes, ordered by request direction ───────────── */
const LANES = [
  {t:'Client features',      f:n => n.kind==='client-feature'},
  {t:'Platform',             f:n => n.kind==='infra'},
  {t:'Server domain modules',f:n => n.kind==='server-module'},
  {t:'Data & external',      f:n => n.kind==='datastore'||n.kind==='external'},
];
const NW=158, NH=40, GAPY=13, LANEW=210, TOP=42, PADX=16;

function layout(){
  const cols = LANES.map(l => visible().filter(l.f));
  const maxRows = Math.max(...cols.map(c => c.length));
  const H = TOP + maxRows*(NH+GAPY) + 24;
  const W = PADX*2 + LANES.length*LANEW;
  const pos = {};
  const track = maxRows*(NH+GAPY)-GAPY;
  cols.forEach((col,ci) => {
    // Distribute evenly down the tallest lane's track: a lane with few nodes
    // spreads out to meet its neighbours rather than clumping or floating.
    col.forEach((n,ri) => {
      const y = col.length === 1
        ? TOP + (track - NH)/2
        : TOP + ri*(track - NH)/(col.length - 1);
      pos[n.id] = {x: PADX+ci*LANEW+(LANEW-NW)/2, y, ci};
    });
  });
  return {pos, W, H, cols, laid: cols.flat()};
}

function edgePath(a,b){
  const x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2;
  if (b.ci > a.ci){ const m=(x1+x2)/2; return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`; }
  // backward / same-lane edge: route around the left side
  const xa=a.x, xb=b.x+NW, off=Math.max(26, 20+Math.abs(y1-y2)/7);
  return `M${xa},${y1} C${xa-off},${y1} ${xb+off},${y2} ${xb},${y2}`;
}

function render(){
  const {pos,W,H,cols,laid} = layout();
  const svg = document.getElementById('graph');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const vis = new Set(Object.keys(pos));
  // Project every real edge onto the currently-visible representatives, then
  // dedupe so a collapsed lane shows one arrow per relationship, not eight.
  const seen = new Map();
  for (const e of D.edges){
    const f = repr(e.from), t = repr(e.to);
    if (f === t || !vis.has(f) || !vis.has(t)) continue;
    const k = f+'>'+t+'>'+e.kind;
    if (!seen.has(k)) seen.set(k, {from:f, to:t, kind:e.kind, labels:[...e.labels]});
    else { const x = seen.get(k); for (const l of e.labels) if (!x.labels.includes(l)) x.labels.push(l); }
  }
  const eds = [...seen.values()];

  const hi = new Set(), hiEdge = new Set();
  if (sel){ hi.add(sel);
    eds.forEach((e,i) => { if(e.from===sel||e.to===sel){ hi.add(e.from); hi.add(e.to); hiEdge.add(i);} });
  }
  const match = n => !query || (n.label+' '+(n.path||'')+' '+n.role).toLowerCase().includes(query);

  let s = `<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6"
    markerHeight="6" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="currentColor" opacity=".3"/></marker>
    <marker id="ahh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5"
    markerHeight="6.5" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="var(--accent)"/></marker></defs>`;

  LANES.forEach((l,i) => {
    s += `<rect class="lanebg" x="${PADX+i*LANEW-4}" y="${TOP-26}" width="${LANEW-8}"
      height="${H-TOP+16}" rx="10"/>`;
    s += `<text class="lane" x="${PADX+i*LANEW+LANEW/2}" y="${TOP-32}" text-anchor="middle">${l.t}</text>`;
  });

  eds.forEach((e,i) => {
    const on = hiEdge.has(i);
    const cls = 'ed' + (on?' hi':(sel?' dim':''));
    const tip = (e.from+' \u2192 '+e.to+(e.labels.length?': '+e.labels.join(', '):''))
      .replace(/&/g,'&amp;').replace(/</g,'&lt;');
    s += `<path class="${cls}" data-from="${e.from}" data-to="${e.to}"
      d="${edgePath(pos[e.from],pos[e.to])}"
      marker-end="url(#${on?'ahh':'ah'})"><title>${tip}</title></path>`;
  });

  laid.forEach(n => {
    const p = pos[n.id], k = KIND[n.kind];
    const dim = (sel && !hi.has(n.id)) || !match(n);
    const sub = n.isGroup ? n.memberIds.length+' grouped · '+n.loc.toLocaleString()+' loc'
      : n.kind==='datastore' ? n.models.length+' models'
      : n.loc ? n.loc.toLocaleString()+' loc' : 'integration';
    s += `<g class="nd${n.id===sel?' sel':''}${dim?' dim':''}" data-id="${n.id}"
        tabindex="0" role="button" aria-label="${n.label}${n.isGroup?', grouped, activate to expand':''}">`;
    if (n.isGroup) s += `<rect x="${p.x+4}" y="${p.y+4.5}" width="${NW}" height="${NH}" rx="8"
        fill="var(--panel)" stroke="${k.c}" stroke-width="1" opacity=".45"/>`;
    s += `<rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="8"
        fill="var(--panel)" stroke="${k.c}" stroke-width="1.5"/>
      <rect x="${p.x}" y="${p.y}" width="3.5" height="${NH}" rx="1.75" fill="${k.c}"/>
      <text x="${p.x+13}" y="${p.y+17}">${n.label}</text>
      <text class="cnt" x="${p.x+13}" y="${p.y+31}">${sub}</text>
      ${n.isGroup?`<text class="cnt" x="${p.x+NW-11}" y="${p.y+23}" text-anchor="end"
        style="font-size:13px;font-weight:700;fill:${k.c}">+</text>`:''}
    </g>`;
  });
  svg.innerHTML = s;
  svg.querySelectorAll('.nd').forEach(g => {
    const pick = () => {
      const id = g.dataset.id;
      if (GROUPS[id]) { expanded.add(id); sel = null; syncGroupBtns(); render(); detail(); return; }
      sel = (sel===id?null:id); render(); detail();
    };
    g.addEventListener('click', pick);
    g.addEventListener('mouseenter', () => { if(!sel) hoverEdges(g.dataset.id, true); });
    g.addEventListener('mouseleave', () => { if(!sel) hoverEdges(g.dataset.id, false); });
    g.addEventListener('keydown', ev => { if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick();} });
  });
}

// Light up a node's edges on hover (only while nothing is selected).
function hoverEdges(id, on){
  document.getElementById('graph').querySelectorAll('.ed').forEach(p => {
    if (p.dataset.from === id || p.dataset.to === id) p.classList.toggle('hi', on);
  });
}

/* ── detail panel ───────────────────────────────────────────────────────── */
const VERB = {calls:'calls',uses:'uses',persists:'persists',routes:'mounts',external:'integrates',http:'HTTP'};

function relList(rels, dir){
  if (!rels.length) return '<div class="empty">None.</div>';
  return '<div class="rel">' + rels.map(r => {
    const t = N[r.id]; if(!t) return '';
    const lbl = r.labels && r.labels.length ? `<span class="lbl">${r.labels.join(' · ')}</span>` : '';
    return `<a href="#" data-go="${r.id}"><span class="vb">${VERB[r.kind]||r.kind}</span>
      <span>${t.label}${lbl?' '+lbl:''}</span></a>`;
  }).join('') + '</div>';
}

function detail(){
  const el = document.getElementById('detail');
  if (!sel){
    el.innerHTML = `<h3>Select a node</h3>
      <p class="role">Click any box in the map to see its role, who calls into it,
      what it depends on, what it can break downstream, and the test files that
      cover it. Every path shown is read from the working tree at
      <code>${D.meta.generatedFrom.commit.slice(0,7)}</code>.</p>
      <div class="sec"><h4>Reading the map</h4><p class="role">
      Lanes run in request order — client features call server modules through
      <code>lib/apiClient.js</code>, modules call each other directly, and the right lane holds
      MongoDB and the external services. Backward-curving arrows are the interesting ones:
      they mark modules that call <em>into</em> a lane to their left, like
      <code>games</code> reaching back through <code>feed</code> to publish a post.</p></div>`;
    return;
  }
  const n = GROUPS[sel] ? synth(sel) : N[sel], k = KIND[n.kind];
  if (n.isGroup){
    n.upstream = []; n.downstream = [];
    const seenU = new Set(), seenD = new Set();
    for (const e of D.edges){
      const f = repr(e.from), t = repr(e.to);
      if (t === sel && f !== sel && !seenU.has(f+e.kind)){ seenU.add(f+e.kind); n.upstream.push({id:f,kind:e.kind,labels:e.labels}); }
      if (f === sel && t !== sel && !seenD.has(t+e.kind)){ seenD.add(t+e.kind); n.downstream.push({id:t,kind:e.kind,labels:e.labels}); }
    }
  }
  const fl = D.flows.filter(f => n.flows.includes(f.id));
  el.innerHTML = `
    <span class="kindtag" style="color:${k.c};background:color-mix(in srgb,${k.c} 12%,transparent)">${k.t}</span>
    <h3>${n.label}</h3>
    ${n.path?`<div class="ppath mono">${n.path}/</div>`:''}
    <p class="role">${n.role}</p>
    ${n.isGroup?`<div class="sec"><h4>Grouped nodes <span>${n.memberIds.length}</span></h4>
      <div class="rel">${n.memberIds.map(id=>`<a href="#" data-go="${id}">
        <span class="vb">open</span><span>${N[id].label}</span></a>`).join('')}</div>
      <p style="margin:9px 0 0"><button class="t" data-g="${sel}">Expand this lane in the map</button></p>
      </div>`:''}
    ${n.mount?`<div class="sec"><h4>Mounted at</h4><div class="mono" style="font-size:11.5px">${n.mount}</div></div>`:''}
    ${n.models.length?`<div class="sec"><h4>Mongoose models <span>${n.models.length}</span></h4>
      <div class="mods">${n.models.map(m=>`<span>${m}</span>`).join('')}</div></div>`:''}
    <div class="sec"><h4>Upstream callers <span>${n.upstream.length}</span></h4>${relList(n.upstream)}</div>
    <div class="sec"><h4>Dependencies &amp; downstream impact <span>${n.downstream.length}</span></h4>${relList(n.downstream)}</div>
    ${fl.length?`<div class="sec"><h4>Appears in flows</h4><div class="rel">${
      fl.map(f=>`<a href="#" data-flow="${f.id}"><span class="vb">flow</span><span>${f.name}</span></a>`).join('')
    }</div></div>`:''}
    <div class="sec"><h4>Tests <span>${n.tests.length}</span></h4>${
      n.tests.length?`<ul class="files">${n.tests.map(t=>{
        const b=t.split('/').pop(); return `<li>${t.slice(0,t.length-b.length)}<b>${b}</b></li>`;}).join('')}</ul>`
      :'<div class="empty">No dedicated test files.</div>'}</div>
    <div class="sec"><h4>Source files <span>${n.files.length}</span></h4>${
      n.files.length?`<ul class="files">${n.files.map(f=>{
        const b=f.split('/').pop(); return `<li>${f.slice(0,f.length-b.length)}<b>${b}</b></li>`;}).join('')}</ul>`
      :'<div class="empty">External — no files in this repo.</div>'}</div>`;

  el.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault();
    const id = a.dataset.go;
    reveal(id);
    sel = id; render(); detail(); el.scrollTop = 0;
  }));
  el.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => {
    expanded.add(b.dataset.g); sel = null; syncGroupBtns(); render(); detail();
  }));
  el.querySelectorAll('[data-flow]').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault(); showFlow(a.dataset.flow);
    document.getElementById('ftabs').scrollIntoView({behavior:'smooth',block:'center'});
  }));
}

/* ── flows ──────────────────────────────────────────────────────────────── */
let curFlow = D.flows[0].id;
function showFlow(id){
  curFlow = id;
  document.querySelectorAll('#ftabs .ft').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.f===id)));
  const f = D.flows.find(x => x.id===id);
  document.getElementById('fpane').innerHTML =
    `<p class="fwhy"><b>Why it matters —</b> ${f.why}</p><ol class="steps">${
      f.steps.map(s => {
        const t = N[s.node] || synth(s.node), c = KIND[t.kind].c;
        const b = s.file.split('/').pop();
        return `<li><div class="stitle">${s.label}</div>
          <button class="snode" data-go="${s.node}" style="color:${c}">${t.label}</button>
          <div class="sfile">${s.file.slice(0,s.file.length-b.length)}<b>${b}</b>${
            s.symbol?` · <span style="color:var(--accent)">${s.symbol.replace(/</g,'&lt;')}</span>`:''}</div></li>`;
      }).join('')}</ol>`;
  document.querySelectorAll('#fpane .snode').forEach(btn => btn.addEventListener('click', () => {
    const id2 = btn.dataset.go;
    reveal(id2);
    sel = id2; render(); detail();
    document.getElementById('graph').scrollIntoView({behavior:'smooth',block:'center'});
  }));
}

/* ── header + controls ──────────────────────────────────────────────────── */
const m = D.meta;
document.getElementById('subtitle').textContent = m.subtitle;
document.getElementById('meta').innerHTML = [
  ['server modules', m.counts.serverModules], ['client features', m.counts.clientFeatures],
  ['Mongoose models', m.counts.mongooseModels], ['server tests', m.counts.serverTestFiles],
  ['client tests', m.counts.clientTestFiles], ['commit', m.generatedFrom.commit.slice(0,7)],
].map(([k,v]) => `<span class="chip"><b>${v}</b> ${k}</span>`).join('');
document.getElementById('foot').innerHTML =
  `Generated from <code>${m.generatedFrom.branch}</code> @ <code>${m.generatedFrom.commit.slice(0,10)}</code>
   — ${m.counts.primaryNodes} nodes, ${D.edges.length} edges, ${D.flows.length} flows.
   Module edges are extracted by parsing every <code>require()</code> in
   <code>server/src/modules</code>; client→server edges from <code>apiClient</code>
   call sites. Data: <code>codemap.json</code> · integrity: <code>codemap.lock</code>.
   Regenerate after structural changes — <code>codemap.lock</code> records the tree it was built from.`;

// Make a real node addressable: unfold its group and unhide minor modules.
function reveal(id){
  if (MINOR.has(id) && !showMinor){ showMinor = true; syncTgl(); }
  for (const [gid,g] of Object.entries(GROUPS))
    if (g.members.includes(id) && !expanded.has(gid)) expanded.add(gid);
  syncGroupBtns();
}
function syncGroupBtns(){
  document.querySelectorAll('[data-g]').forEach(b => {
    const on = expanded.has(b.dataset.g);
    b.setAttribute('aria-pressed', String(on));
    const word = b.dataset.g==='g-client' ? 'client' : 'external';
    b.textContent = (on?'Collapse ':'Expand ') + word;
  });
}
function syncTgl(){
  const b = document.getElementById('tgl');
  b.setAttribute('aria-pressed', String(showMinor));
  b.textContent = showMinor ? 'Hide minor modules' : 'Show minor modules';
}
document.getElementById('tgl').addEventListener('click', () => {
  showMinor = !showMinor; syncTgl();
  if (sel && MINOR.has(sel) && !showMinor){ sel = null; detail(); }
  render();
});
document.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => {
  const g = b.dataset.g;
  if (expanded.has(g)){
    expanded.delete(g);
    if (sel && GROUPS[g].members.includes(sel)) { sel = null; detail(); }
  } else expanded.add(g);
  syncGroupBtns(); render(); detail();
}));
document.getElementById('rst').addEventListener('click', () => {
  sel=null; query=''; showMinor=false; expanded=new Set();
  document.getElementById('q').value='';
  syncTgl(); syncGroupBtns(); render(); detail();
});
document.getElementById('q').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase(); render();
});
document.getElementById('ftabs').innerHTML = D.flows.map(f =>
  `<button class="ft" role="tab" data-f="${f.id}">${f.name}</button>`).join('');
document.querySelectorAll('#ftabs .ft').forEach(b =>
  b.addEventListener('click', () => showFlow(b.dataset.f)));

syncTgl(); syncGroupBtns(); render(); detail(); showFlow(curFlow);
</script>
</body>
</html>
